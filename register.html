{% extends "base.html" %}

{% block title %}EcoSphere - Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card-glass auth-card">
        <div class="auth-header">
            <div class="brand">
                <i data-lucide="leaf" style="width: 32px; height: 32px;"></i>
                <span style="font-size: 1.8rem; font-weight: 800;">EcoSphere</span>
            </div>
            <h2 class="auth-title">Join EcoSphere</h2>
            <p class="auth-subtitle">Start your sustainable living journey today</p>
        </div>
        
        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; margin-top: 1rem;">
                Create Account <i data-lucide="user-plus"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('main.login') }}">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
