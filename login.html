{% extends "base.html" %}

{% block title %}EcoSphere - Log In{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card-glass auth-card">
        <div class="auth-header">
            <div class="brand">
                <i data-lucide="leaf" style="width: 32px; height: 32px;"></i>
                <span style="font-size: 1.8rem; font-weight: 800;">EcoSphere</span>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to track your green milestones</p>
        </div>
        
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <div class="form-group" style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
                <label class="form-check">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Remember my session</span>
                </label>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
                Sign In <i data-lucide="log-in"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
